const LBL={VF:["VF","vf"],VOF:["Version originale française","vf"],BA:["Bande-annonce VF","tr"]};
const all=[...FILMS,...SERIES,...DOCS,...TRAILERS],byId=Object.fromEntries(all.map(x=>[x.id,x]));
const MAIN=["Action","Thriller","Policier","Comédie","Drame","Horreur","Documentaire","Romance","Guerre","Western"];
const genres=[...MAIN,...[...new Set(all.flatMap(x=>x.g))].filter(g=>!MAIN.includes(g)).sort((a,b)=>a.localeCompare(b,"fr"))];
const decades=[...new Set(all.filter(x=>x.y).map(x=>Math.floor(x.y/10)*10))].sort();
const yt0=x=>x.yt||(x.eps&&x.eps[0].yt);
const thumb=x=>yt0(x)?`https://i.ytimg.com/vi/${yt0(x)}/hqdefault.jpg`:`https://archive.org/services/img/${x.ia}`;
const hue=s=>[...s].reduce((a,c)=>a+c.charCodeAt(0)*7,0)%360;
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let favs=[];try{favs=JSON.parse(localStorage.getItem("cine-favs")||"[]")}catch(e){}
const saveF=()=>{try{localStorage.setItem("cine-favs",JSON.stringify(favs))}catch(e){}};
const full=x=>x.kind!=="ba";
const tag=x=>x.kind==="serie"?`<i class="tag">SÉRIE · ${x.eps.length} ÉP.</i>`:x.kind==="doc"?'<i class="tag">▶ DOC COMPLET</i>':full(x)?'<i class="tag">▶ FILM COMPLET</i>':'<i class="tag tr">BANDE-ANNONCE</i>';
const lang=x=>`<b class="lg ${LBL[x.lang][1]}">${LBL[x.lang][0]}</b>`;
const card=x=>{const h=hue(x.t);return `<div class="card" onclick="go('#/film/${x.id}')"><div class="poster" style="background:linear-gradient(160deg,hsl(${h},60%,35%),hsl(${(h+60)%360},50%,12%))"><img src="${thumb(x)}" alt="" loading="lazy" onerror="this.remove()">${tag(x)}<span>${esc(x.t)}</span></div><small>${lang(x)} · ${esc(x.g[0])}${x.len?" · "+x.len:""}</small></div>`};
const row=(t,l,more)=>l.length?`<h2>${t}${more?` <a class="more" href="${more}">Tout voir ›</a>`:""}</h2><div class="row">${l.slice(0,24).map(card).join("")}</div>`:"";
let lim=90;const grid=l=>l.length?`<div class="grid">${l.slice(0,lim).map(card).join("")}</div>${l.length>lim?`<p style="text-align:center;margin:16px"><button class="btn sec" onclick="lim+=90;${location.hash.startsWith("#/explorer")?"upd()":"render(true)"}">Afficher plus (${l.length-lim})</button></p>`:""}`:'<p class="empty">Aucun titre ne correspond.</p>';
const F={now:false,type:null,g:null,dec:null};let q="";
const TYPES=[["film","Films"],["serie","Séries"],["doc","Documentaires"],["ba","Bandes-annonces"]];
const filtered=()=>{const s=q.trim().toLowerCase();return all.filter(x=>(!F.now||full(x))&&(!F.type||x.kind===F.type)&&(!F.g||x.g.includes(F.g))&&(!F.dec||(x.y&&Math.floor(x.y/10)*10===F.dec))&&(!s||[x.t,x.d,x.g.join(" "),x.y,x.ch,(x.eps||[]).map(e=>e.t).join(" ")].join(" ").toLowerCase().includes(s)))};
const chip=(on,lbl,act)=>`<span class="chip ${on?"on":""}" onclick="${act}">${lbl}</span>`;
const byG=g=>FILMS.filter(x=>x.g.includes(g));
const nEps=SERIES.reduce((a,x)=>a+x.eps.length,0);
const views={
home(){const h=byId["l-atalante"];return `<div class="hero" style="background-image:url(${thumb(FILMS[1])})"><div><span class="badge">100 % EN FRANÇAIS · GRATUIT & LÉGAL</span><h1>${FILMS.length} films, ${SERIES.length} séries</h1><p class="meta">${nEps} épisodes · ${DOCS.length} documentaires · tout se regarde ici</p><button class="btn" onclick="go('#/films')">▶ Parcourir les films</button><button class="btn sec" onclick="go('#/series')">Séries</button></div></div>`
+row("Films français (FranceTV Distribution)",FILMS.filter(x=>/FranceTV/.test(x.ch)),"#/films")
+row("Séries en VF",[...SERIES].sort((a,b)=>b.eps.length-a.eps.length),"#/series")
+MAIN.filter(g=>g!=="Documentaire").map(g=>row(g,byG(g).slice().reverse())).join("")
+row("Documentaires complets",DOCS,"#/docs")
+row("Patrimoine : L'Atalante (Jean Vigo, 1934)",[h])
+row("Grands films – bandes-annonces VF",TRAILERS)},
films(){return `<header>Films complets</header><p class="meta pad">${FILMS.length} films à regarder en entier dans l'application, en VF.</p>${grid(FILMS)}`},
series(){return `<header>Séries</header><p class="meta pad">${SERIES.length} séries · ${nEps} épisodes en français, depuis des chaînes officielles ou vérifiées.</p>${grid(SERIES)}`},
docs(){return `<header>Documentaires</header><p class="meta pad">${DOCS.length} documentaires complets en français.</p>${grid(DOCS)}`},
explorer(){return `<header>Explorer</header><input id="q" type="search" placeholder="Titre, acteur, épisode…" value="${esc(q)}" oninput="q=this.value;lim=90;upd()"><div class="chips">${chip(F.now,"▶ Regarder maintenant","F.now=!F.now;render()")}${chip(!F.type,"Tout","F.type=null;render()")}${TYPES.map(([k,v])=>chip(F.type===k,v,`F.type='${k}';render()`)).join("")}</div><div class="chips">${chip(!F.g,"Tous genres","F.g=null;render()")}${genres.map(g=>chip(g===F.g,g,`F.g='${esc(g)}';render()`)).join("")}</div><div class="chips">${chip(!F.dec,"Toutes décennies","F.dec=null;render()")}${decades.map(d=>chip(d===F.dec,"Années "+d,`F.dec=${d};render()`)).join("")}</div><div id="res"></div>`},
favs(){const l=favs.map(i=>byId[i]).filter(Boolean);return `<header>Ma liste</header>`+(l.length?grid(l):`<p class="empty">Aucun favori pour l'instant.<br>Ajoutez des titres avec « + Ma liste ».</p>`)},
film(id,ep){const x=byId[id];if(!x)return `<p class="empty">Titre introuvable.</p>`;const f=favs.includes(x.id);const e=x.eps?x.eps[Math.min(+ep||0,x.eps.length-1)]:null;const v=e?e.yt:x.yt;
const player=x.mp4?`<video id="player" controls preload="metadata" playsinline poster="${thumb(x)}" src="${x.mp4}"></video>`:`<iframe id="player" referrerpolicy="strict-origin-when-cross-origin" src="https://www.youtube-nocookie.com/embed/${v}?rel=0&hl=fr" title="${esc(x.t)}" allow="autoplay;encrypted-media;picture-in-picture;fullscreen" allowfullscreen></iframe>`;
const eps=x.eps?`<div class="box"><h3>Épisodes (${x.eps.length})</h3>${x.eps.map((p,i)=>`<div class="ep ${p===e?"on":""}" onclick="go('#/film/${x.id}/${i}')"><img src="https://i.ytimg.com/vi/${p.yt}/mqdefault.jpg" alt="" loading="lazy"><div><b>${i+1}. ${esc(p.t)}</b><small>${p.len||""}</small></div></div>`).join("")}</div>`:"";
const info=x.kind==="ba"?`<div class="box"><h3>Bande-annonce VF</h3>Bande-annonce officielle française (chaîne : ${esc(x.ch)}). Le film complet n'est pas disponible gratuitement ; seule la bande-annonce est lisible ici.</div>`
:`<div class="box"><h3>${x.kind==="serie"?"Épisodes complets":x.kind==="doc"?"Documentaire complet":"Film complet"} – lecture dans l'application</h3>Source : ${esc(x.ch)}${x.ia?"":" (chaîne YouTube officielle/vérifiée, diffusion gratuite)"}.${x.orig?" "+esc(x.orig)+".":""}</div>`;
return `<div style="position:relative"><button class="back" onclick="history.length>1?history.back():go('#/home')">‹</button><div class="vid">${player}</div></div><div class="det">${lang(x)} <span class="badge ${full(x)?"":"tr"}">${x.kind==="serie"?"SÉRIE":x.kind==="doc"?"DOCUMENTAIRE":full(x)?"FILM COMPLET":"BANDE-ANNONCE"}</span><h1 style="font-size:23px;margin-top:8px">${esc(x.t)}</h1>${e?`<p class="meta">▶ ${esc(e.t)}</p>`:""}<p class="meta">${[x.y,x.d,x.len].filter(Boolean).map(esc).join(" · ")}</p><p class="meta">${x.g.join(" · ")}</p><button class="btn" onclick="toggleFav('${x.id}')">${f?"✓ Dans ma liste":"+ Ma liste"}</button>${x.syn?`<p style="margin-top:14px;line-height:1.5">${esc(x.syn)}</p>`:""}${eps}${info}<p class="meta">Aucune note affichée (pas de note inventée).</p></div>`}};
function upd(){const el=document.getElementById("res");if(!el)return;const l=filtered();el.innerHTML=`<h2>${l.length} titre${l.length>1?"s":""}</h2>${grid(l)}`}
function toggleFav(id){favs=favs.includes(id)?favs.filter(i=>i!==id):[...favs,id];saveF();render(true)}
function go(h){location.hash=h}
const tabs=[["home","⌂","Accueil"],["films","▶","Films"],["series","▤","Séries"],["explorer","⌕","Explorer"],["favs","♥","Ma liste"]];
function render(keep){const y=scrollY;const p=(location.hash.slice(2)||"home").split("/"),v=views[p[0]]?p[0]:"home";if(!keep)lim=90;document.getElementById("app").innerHTML=(v==="home"?"<header>CINÉLIBRE <small style=\"color:#fff;font-size:12px;font-weight:600\">100 % VF</small></header>":"")+views[v](p[1],p[2]);if(v==="explorer")upd();
document.getElementById("nav").innerHTML=tabs.map(([k,i,l])=>`<button class="${k===v?"on":""}" onclick="go('#/${k}')"><b>${i}</b>${l}</button>`).join("");scrollTo(0,keep?y:0)}
addEventListener("hashchange",()=>render());render();
</script></body></html>
