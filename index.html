,"g":["Horreur","Thriller"],"yt":"XzmeT5rEPDg","ch":"Universal Pictures France","lang":"BA","kind":"ba"},{"id":"django-unchained","t":"Django Unchained","y":2012,"d":"Quentin Tarantino","g":["Western","Drame"],"yt":"K2XjgsfzDrU","ch":"SonyPicturesFr","lang":"BA","kind":"ba"},{"id":"top-gun-maverick","t":"Top Gun : Maverick","y":2022,"d":"Joseph Kosinski","g":["Action"],"yt":"MNXRV-OspoY","ch":"Paramount Pictures France","lang":"BA","kind":"ba"},{"id":"barbie","t":"Barbie","y":2023,"d":"Greta Gerwig","g":["Comédie"],"yt":"67KHcNX_68g","ch":"Warner Bros. France","lang":"BA","kind":"ba"},{"id":"harry-potter-a-l-ecole-des-sorciers","t":"Harry Potter à l'école des sorciers","y":2001,"d":"Chris Columbus","g":["Fantastique","Aventure"],"yt":"P1BGgqhVGAI","ch":"Warner Bros. France","lang":"BA","kind":"ba"},{"id":"les-indestructibles-2","t":"Les Indestructibles 2","y":2018,"d":"Brad Bird","g":["Animation","Action"],"yt":"sXsr_7Una_A","ch":"Disney FR","lang":"BA","kind":"ba"},{"id":"blade-runner-2049","t":"Blade Runner 2049","y":2017,"d":"Denis Villeneuve","g":["Science-fiction"],"yt":"O4C5cwSbXZ8","ch":"SonyPicturesFr","lang":"BA","kind":"ba"},{"id":"arrival-premier-contact","t":"Arrival (Premier Contact)","y":2016,"d":"Denis Villeneuve","g":["Science-fiction","Drame"],"yt":"rcOKL69bKpQ","ch":"SonyPicturesFr","lang":"BA","kind":"ba"},{"id":"le-loup-de-wall-street","t":"Le Loup de Wall Street","y":2013,"d":"Martin Scorsese","g":["Comédie","Drame"],"yt":"GT9UfSqBz9o","ch":"Metropolitan Films","lang":"BA","kind":"ba"},{"id":"avengers-endgame","t":"Avengers : Endgame","y":2019,"d":"Anthony et Joe Russo","g":["Action","Science-fiction"],"yt":"wV-Q0o2OQjQ","ch":"Marvel FR","lang":"BA","kind":"ba"},{"id":"kung-fu-panda","t":"Kung Fu Panda","y":2008,"d":"Mark Osborne, John Stevenson","g":["Animation","Comédie"],"yt":"yt9r0Q5za38","ch":"Paramount Pictures France","lang":"BA","kind":"ba"}];

const LBL={VF:["VF","vf"],VOF:["Version originale française","vf"],MUET_FR:["V.O. française · muet (intertitres FR)","mu"],MUET:["V.O. française · muet, sans dialogue","mu"],SD:["Sans dialogue","mu"],BA:["Bande-annonce VF","tr"]};
const all=[...FREE,...SERIES,...TRAILERS],byId=Object.fromEntries(all.map(x=>[x.id,x]));
const genres=[...new Set(all.flatMap(x=>x.g))].sort((a,b)=>a.localeCompare(b,"fr"));
const decades=[...new Set(all.filter(x=>x.y).map(x=>Math.floor(x.y/10)*10))].sort();
const yt0=x=>x.yt||(x.eps&&x.eps[0].yt);
const thumb=x=>yt0(x)?`https://i.ytimg.com/vi/${yt0(x)}/hqdefault.jpg`:`https://archive.org/services/img/${x.ia}`;
const hue=s=>[...s].reduce((a,c)=>a+c.charCodeAt(0)*7,0)%360;
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let favs=[];try{favs=JSON.parse(localStorage.getItem("cine-favs")||"[]")}catch(e){}
const saveF=()=>{try{localStorage.setItem("cine-favs",JSON.stringify(favs))}catch(e){}};
const full=x=>x.kind!=="ba";
const tag=x=>x.kind==="serie"?`<i class="tag">SÉRIE · ${x.eps.length} ÉP.</i>`:full(x)?'<i class="tag">▶ COMPLET</i>':'<i class="tag tr">BANDE-ANNONCE</i>';
const lang=x=>`<b class="lg ${LBL[x.lang][1]}">${LBL[x.lang][0]}</b>`;
const card=x=>{const h=hue(x.t);return `<div class="card" onclick="go('#/film/${x.id}')"><div class="poster" style="background:linear-gradient(160deg,hsl(${h},60%,35%),hsl(${(h+60)%360},50%,12%))"><img src="${thumb(x)}" alt="" loading="lazy" onerror="this.remove()">${tag(x)}<span>${esc(x.t)}</span></div><small>${lang(x)}${x.y?" · "+x.y:""}${x.len?" · "+x.len:""}</small></div>`};
const row=(t,l,more)=>l.length?`<h2>${t}${more?` <a class="more" href="${more}">Tout voir ›</a>`:""}</h2><div class="row">${l.map(card).join("")}</div>`:"";
const grid=l=>l.length?`<div class="grid">${l.map(card).join("")}</div>`:'<p class="empty">Aucun titre ne correspond.</p>';
const F={now:false,type:null,g:null,dec:null};let q="";
const TYPES=[["film","Films"],["serie","Séries"],["court","Courts-métrages"],["ba","Bandes-annonces"]];
const filtered=()=>{const s=q.trim().toLowerCase();return all.filter(x=>(!F.now||full(x))&&(!F.type||x.kind===F.type)&&(!F.g||x.g.includes(F.g))&&(!F.dec||(x.y&&Math.floor(x.y/10)*10===F.dec))&&(!s||[x.t,x.d,x.g.join(" "),x.y,x.ch,(x.eps||[]).map(e=>e.t).join(" ")].join(" ").toLowerCase().includes(s)))};
const chip=(on,lbl,act)=>`<span class="chip ${on?"on":""}" onclick="${act}">${lbl}</span>`;
const vfFilms=FREE.filter(x=>x.lang==="VF"&&x.kind==="film");
const views={
home(){const h=SERIES[0];return `<div class="hero" style="background-image:url(${thumb(h)})"><div><span class="badge">100 % EN FRANÇAIS · GRATUIT & LÉGAL</span><h1>${esc(h.t)}</h1><p class="meta">${h.y} · ${h.eps.length} épisodes en VF</p><button class="btn" onclick="go('#/film/${h.id}')">▶ Regarder</button><button class="btn sec" onclick="toggleFav('${h.id}')">${favs.includes(h.id)?"✓ Ma liste":"+ Ma liste"}</button></div></div>`
+row("Films complets en VF",vfFilms.filter(x=>x.src.includes("FranceTV")),"#/films")
+row("Séries & dessins animés VF",SERIES,"#/series")
+row("Films d'animation en VF",vfFilms.filter(x=>x.g.includes("Animation")))
+row("Familles & comédies VF",vfFilms.filter(x=>!x.g.includes("Animation")&&!x.src.includes("FranceTV")))
+row("Patrimoine français (domaine public)",FREE.filter(x=>x.ia))
+row("Grands films – bandes-annonces VF",TRAILERS,"#/explorer")
+row("Courts-métrages sans dialogue",FREE.filter(x=>x.lang==="SD"))},
films(){const l=FREE.filter(x=>x.kind==="film");return `<header>Films complets</header><p class="meta pad">${l.length} films à regarder en entier dans l'application, en VF ou en version originale française.</p>${grid(l)}`},
series(){return `<header>Séries</header><p class="meta pad">${SERIES.length} séries · ${SERIES.reduce((a,x)=>a+x.eps.length,0)} épisodes en français, depuis les chaînes officielles.</p>${grid(SERIES)}`},
explorer(){const l=filtered();return `<header>Explorer</header><input id="q" type="search" placeholder="Titre, réalisateur, épisode…" value="${esc(q)}" oninput="q=this.value;upd()"><div class="chips">${chip(F.now,"▶ Regarder maintenant","F.now=!F.now;render()")}${chip(!F.type,"Tout","F.type=null;render()")}${TYPES.map(([k,v])=>chip(F.type===k,v,`F.type='${k}';render()`)).join("")}</div><div class="chips">${chip(!F.g,"Tous genres","F.g=null;render()")}${genres.map(g=>chip(g===F.g,g,`F.g='${esc(g)}';render()`)).join("")}</div><div class="chips">${chip(!F.dec,"Toutes décennies","F.dec=null;render()")}${decades.map(d=>chip(d===F.dec,"Années "+d,`F.dec=${d};render()`)).join("")}</div><div id="res"><h2>${l.length} titre${l.length>1?"s":""}</h2>${grid(l)}</div>`},
favs(){const l=favs.map(i=>byId[i]).filter(Boolean);return `<header>Ma liste</header>`+(l.length?grid(l):`<p class="empty">Aucun favori pour l'instant.<br>Ajoutez des titres avec « + Ma liste ».</p>`)},
film(id,ep){const x=byId[id];if(!x)return `<p class="empty">Titre introuvable.</p>`;const f=favs.includes(x.id);const e=x.eps?x.eps[Math.min(+ep||0,x.eps.length-1)]:null;const v=e?e.yt:x.yt;
const player=x.mp4?`<video id="player" controls preload="metadata" playsinline poster="${thumb(x)}" src="${x.mp4}"></video>`:`<iframe id="player" referrerpolicy="strict-origin-when-cross-origin" src="https://www.youtube-nocookie.com/embed/${v}?rel=0&hl=fr&cc_load_policy=0" title="${esc(x.t)}" allow="autoplay;encrypted-media;picture-in-picture;fullscreen" allowfullscreen></iframe>`;
const eps=x.eps?`<div class="box"><h3>Épisodes (${x.eps.length})</h3>${x.eps.map((p,i)=>`<div class="ep ${p===e?"on":""}" onclick="go('#/film/${x.id}/${i}')"><img src="https://i.ytimg.com/vi/${p.yt}/mqdefault.jpg" alt="" loading="lazy"><div><b>${i+1}. ${esc(p.t)}</b><small>${p.len||""}</small></div></div>`).join("")}</div>`:"";
const info=x.kind==="ba"?`<div class="box"><h3>Bande-annonce VF</h3>Bande-annonce officielle française (chaîne : ${esc(x.ch)}). Le film complet n'est pas disponible gratuitement ; il reste lisible ici en bande-annonce uniquement.</div>`
:`<div class="box"><h3>${x.kind==="serie"?"Épisodes complets":"Film complet"} – lecture dans l'application</h3>Source légale : ${esc(x.src||("chaîne YouTube officielle « "+x.ch+" »"))}.${x.mp4&&x.y<1960?" Copie d'archive : qualité d'image variable.":""}</div>`;
return `<div style="position:relative"><button class="back" onclick="history.length>1?history.back():go('#/home')">‹</button><div class="vid">${player}</div></div><div class="det">${lang(x)} <span class="badge ${full(x)?"":"tr"}">${x.kind==="serie"?"SÉRIE":full(x)?"COMPLET":"BANDE-ANNONCE"}</span><h1 style="font-size:23px;margin-top:8px">${esc(x.t)}</h1>${e?`<p class="meta">▶ ${esc(e.t)}</p>`:""}<p class="meta">${[x.y,x.d,x.len].filter(Boolean).map(esc).join(" · ")}</p><p class="meta">${x.g.join(" · ")}</p><button class="btn" onclick="toggleFav('${x.id}')">${f?"✓ Dans ma liste":"+ Ma liste"}</button>${x.syn?`<p style="margin-top:14px;line-height:1.5">${esc(x.syn)}</p>`:""}${eps}${info}<p class="meta">Aucune note affichée (pas de note inventée).</p></div>`}};
function upd(){const el=document.getElementById("res");if(!el)return;const l=filtered();el.innerHTML=`<h2>${l.length} titre${l.length>1?"s":""}</h2>${grid(l)}`}
function toggleFav(id){favs=favs.includes(id)?favs.filter(i=>i!==id):[...favs,id];saveF();render()}
function go(h){location.hash=h}
const tabs=[["home","⌂","Accueil"],["films","▶","Films"],["series","▤","Séries"],["explorer","⌕","Explorer"],["favs","♥","Ma liste"]];
function render(){const p=(location.hash.slice(2)||"home").split("/"),v=views[p[0]]?p[0]:"home";document.getElementById("app").innerHTML=(v==="home"?"<header>CINÉLIBRE <small style=\"color:#fff;font-size:12px;font-weight:600\">100 % VF</small></header>":"")+views[v](p[1],p[2]);
document.getElementById("nav").innerHTML=tabs.map(([k,i,l])=>`<button class="${k===v?"on":""}" onclick="go('#/${k}')"><b>${i}</b>${l}</button>`).join("");scrollTo(0,0)}
addEventListener("hashchange",render);render();
</script></body></html>
