FREE.forEach(x=>{x.full=true;x.type="gratuit"});FILMS.forEach(x=>{x.type="film"});
const all=[...FREE,...FILMS],byId=Object.fromEntries(all.map(x=>[x.id,x]));
const genres=[...new Set(all.flatMap(x=>x.g))].sort((a,b)=>a.localeCompare(b,"fr"));
const decades=[...new Set(all.map(x=>Math.floor(x.y/10)*10))].sort();
const thumb=x=>x.yt?`https://i.ytimg.com/vi/${x.yt}/hqdefault.jpg`:`https://archive.org/services/img/${x.ia}`;
const hue=s=>[...s].reduce((a,c)=>a+c.charCodeAt(0)*7,0)%360;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let favs=[];try{favs=JSON.parse(localStorage.getItem("cine-favs")||"[]")}catch(e){}
const saveF=()=>localStorage.setItem("cine-favs",JSON.stringify(favs));
const card=x=>{const h=hue(x.t);return `<div class="card" onclick="go('#/film/${x.id}')"><div class="poster" style="background:linear-gradient(160deg,hsl(${h},60%,35%),hsl(${(h+60)%360},50%,12%))"><img src="${thumb(x)}" alt="" loading="lazy" onerror="this.remove()">${x.full?'<i class="tag">▶ COMPLET</i>':'<i class="tag tr">BANDE-ANNONCE</i>'}<span>${esc(x.t)}</span></div><small>${x.y} · ${esc(x.g[0])}${x.len?" · "+x.len:""}</small></div>`};
const row=(t,l,more)=>`<h2>${t}${more?` <a class="more" href="${more}">Tout voir ›</a>`:""}</h2><div class="row">${l.map(card).join("")}</div>`;
const F={now:false,g:null,dec:null};let q="";
const pick=ids=>ids.map(i=>byId[i]).filter(Boolean);
const filtered=()=>all.filter(x=>(!F.now||x.full)&&(!F.g||x.g.includes(F.g))&&(!F.dec||Math.floor(x.y/10)*10===F.dec));
const chip=(on,lbl,act)=>`<span class="chip ${on?"on":""}" onclick="${act}">${lbl}</span>`;
const views={
home(){const h=byId["nosferatu-le-vampire"]||FREE[0];return `<div class="hero" style="background-image:url(${thumb(h)})"><div><span class="badge">FILM COMPLET · GRATUIT & LÉGAL</span><h1>${esc(h.t)}</h1><p class="meta">${h.y} · ${esc(h.d)} · ${h.len}</p><button class="btn" onclick="go('#/film/${h.id}')">▶ Regarder</button><button class="btn sec" onclick="toggleFav('${h.id}')">${favs.includes(h.id)?"✓ Ma liste":"+ Ma liste"}</button></div></div>`
+row("Tendances",pick(["parasite","le-me-cano-de-la-general","oppenheimer","la-nuit-des-morts-vivants","dune","spritefright","everything-everywhere-all-at-once","le-voyage-de-chihiro","inception"]).concat(FILMS.slice(0,0)))
+row(`Films complets gratuits (${FREE.length})`,FREE.filter(x=>x.mp4&&!x.src.startsWith("Blender")),"#/gratuits")
+row("Meilleurs films",FILMS,"#/genres")
+row("Classiques du muet",FREE.filter(x=>x.y<1930))
+row("Courts-métrages libres (Blender)",FREE.filter(x=>x.src.startsWith("Blender")))},
gratuits(){return `<header>Films complets gratuits</header><p class="meta" style="padding:0 16px">${FREE.length} films et courts-métrages légaux : domaine public (archive.org) et œuvres libres Creative Commons.</p><div class="grid">${FREE.map(card).join("")}</div>`},
genres(){const l=filtered();return `<header>Explorer</header><div class="chips">${chip(F.now,"▶ Regarder maintenant","F.now=!F.now;render()")}</div><div class="chips">${chip(!F.g,"Tous genres","F.g=null;render()")}${genres.map(g=>chip(g===F.g,g,`F.g='${g}';render()`)).join("")}</div><div class="chips">${chip(!F.dec,"Toutes décennies","F.dec=null;render()")}${decades.map(d=>chip(d===F.dec,"Années "+(d%100===0?d:String(d).slice(2)).toString().padStart(2,"0"),`F.dec=${d};render()`)).join("")}</div><h2>${l.length} titre${l.length>1?"s":""}</h2>${l.length?`<div class="grid">${l.map(card).join("")}</div>`:'<p class="empty">Aucun titre ne correspond à ces filtres.</p>'}`},
search(){return `<header>Recherche</header><input id="q" type="search" placeholder="Titre, réalisateur, genre, année…" value="${esc(q)}" oninput="q=this.value;res()"><div id="res"></div>`},
favs(){const l=favs.map(i=>byId[i]).filter(Boolean);return `<header>Ma liste</header>`+(l.length?`<div class="grid">${l.map(card).join("")}</div>`:`<p class="empty">Aucun favori pour l'instant.<br>Ajoutez des films avec « + Ma liste ».</p>`)},
film(id){const x=byId[id];if(!x)return `<p class="empty">Film introuvable.</p>`;const f=favs.includes(x.id);
const player=x.mp4?`<video id="player" controls preload="metadata" playsinline poster="${thumb(x)}" src="${x.mp4}"></video>`:`<iframe referrerpolicy="strict-origin-when-cross-origin" src="https://www.youtube-nocookie.com/embed/${x.yt}" title="${esc(x.t)}" allow="encrypted-media;picture-in-picture;fullscreen" allowfullscreen></iframe>`;
const where=x.full?`<p><span class="badge">GRATUIT</span> ${esc(x.src)}.</p><p>${x.ia?`<a href="https://archive.org/details/${x.ia}" target="_blank" rel="noopener">Page archive.org</a>`:""}${x.ia&&x.yt?" · ":""}${x.yt?`<a href="https://www.youtube.com/watch?v=${x.yt}" target="_blank" rel="noopener">YouTube officiel</a>`:""}</p>`
:`<p>Disponibilité variable selon le pays et la période. Consultez un agrégateur légal à jour :</p><p><a href="https://www.justwatch.com/fr/recherche?q=${encodeURIComponent(x.t)}" target="_blank" rel="noopener">JustWatch</a> · <a href="https://vod.cnc.fr/" target="_blank" rel="noopener">Offre légale CNC</a></p>`;
return `<div style="position:relative"><button class="back" onclick="history.length>1?history.back():go('#/home')">‹</button><div class="vid">${player}</div></div><div class="det"><span class="badge ${x.full?"":"tr"}">${x.full?"FILM COMPLET":"BANDE-ANNONCE UNIQUEMENT"}</span><h1 style="font-size:24px;margin-top:8px">${esc(x.t)}</h1><p class="meta">${x.y} · ${esc(x.d)}${x.len?" · "+x.len:""}</p><p class="meta">${x.g.join(" · ")}</p><button class="btn" onclick="toggleFav('${x.id}')">${f?"✓ Dans ma liste":"+ Ma liste"}</button>${x.syn?`<p style="margin-top:14px;line-height:1.5">${esc(x.syn)}</p>`:""}<p class="meta">Note : non affichée (aucune note inventée — voir IMDb/AlloCiné).</p><div class="box"><h3>${x.full?"Film complet":"Bande-annonce"}</h3>${x.full?"Lecture intégrale légale ci-dessus."+(x.mp4&&x.y<1960?" Copie d'archive : qualité d'image variable.":""):`Vidéo YouTube${x.ch?" (chaîne : "+esc(x.ch)+")":""}. Le film complet n'est pas disponible gratuitement ici.`}</div><div class="box"><h3>Où regarder</h3>${where}</div></div>`}};
function res(){const s=q.trim().toLowerCase(),el=document.getElementById("res");if(!el)return;if(!s){el.innerHTML=`<p class="empty">Tapez pour rechercher parmi ${all.length} titres.</p>`;return}const l=all.filter(x=>(x.t+" "+x.d+" "+x.g.join(" ")+" "+x.y).toLowerCase().includes(s));el.innerHTML=l.length?`<div class="grid">${l.map(card).join("")}</div>`:`<p class="empty">Aucun résultat pour « ${esc(q)} ».</p>`}
function toggleFav(id){favs=favs.includes(id)?favs.filter(i=>i!==id):[...favs,id];saveF();render()}
function go(h){location.hash=h}
const tabs=[["home","⌂","Accueil"],["gratuits","▶","Gratuits"],["genres","▦","Explorer"],["search","⌕","Recherche"],["favs","♥","Ma liste"]];
function render(){const p=(location.hash.slice(2)||"home").split("/"),v=views[p[0]]?p[0]:"home";document.getElementById("app").innerHTML=(v==="home"?"<header>CINÉLIBRE</header>":"")+views[v](p[1]);
document.getElementById("nav").innerHTML=tabs.map(([k,i,l])=>`<button class="${k===v?"on":""}" onclick="go('#/${k}')"><b>${i}</b>${l}</button>`).join("");if(v==="search")res();if(v!=="film")scrollTo(0,0)}
addEventListener("hashchange",render);render();
</script></body></html>
